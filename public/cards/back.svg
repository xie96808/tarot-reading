<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1280" viewBox="0 0 800 1280" fill="none">
  <rect width="800" height="1280" rx="28" fill="#F4ECD5"/>
  <!-- outer deep frame -->
  <rect x="28" y="28" width="744" height="1224" rx="18" stroke="#191202" stroke-width="10" fill="none"/>
  <!-- inner fine line -->
  <rect x="48" y="48" width="704" height="1184" rx="12" stroke="#191202" stroke-width="1.5" fill="none" opacity="0.55"/>
  <!-- gold accent hairline -->
  <rect x="62" y="62" width="676" height="1156" rx="8" stroke="#C4A35A" stroke-width="1" fill="none" opacity="0.55"/>
  <!-- central crest panel -->
  <g transform="translate(400 640)">
    <!-- diamond / lozenge frame -->
    <path d="M0 -168 L118 0 L0 168 L-118 0 Z" stroke="#191202" stroke-width="2.5" fill="none" opacity="0.9"/>
    <path d="M0 -148 L100 0 L0 148 L-100 0 Z" stroke="#C4A35A" stroke-width="1" fill="none" opacity="0.45"/>
    <!-- candle body -->
    <rect x="-14" y="18" width="28" height="78" rx="4" fill="#191202" opacity="0.88"/>
    <rect x="-10" y="22" width="20" height="70" rx="3" fill="#2A2110" opacity="0.35"/>
    <!-- drip suggestion -->
    <path d="M-14 30 Q-18 42 -12 48" stroke="#191202" stroke-width="2" fill="none" opacity="0.5"/>
    <!-- flame -->
    <ellipse cx="0" cy="-8" rx="11" ry="22" fill="#C4A35A" opacity="0.85"/>
    <ellipse cx="0" cy="-12" rx="6" ry="14" fill="#F4ECD5" opacity="0.95"/>
    <ellipse cx="0" cy="-2" rx="3.5" ry="7" fill="#191202" opacity="0.35"/>
    <!-- wick -->
    <line x1="0" y1="18" x2="0" y2="6" stroke="#191202" stroke-width="1.6" stroke-linecap="round"/>
    <!-- small gold dots -->
    <circle cx="0" cy="-52" r="2.2" fill="#C4A35A" opacity="0.7"/>
    <circle cx="-42" cy="0" r="1.8" fill="#C4A35A" opacity="0.55"/>
    <circle cx="42" cy="0" r="1.8" fill="#C4A35A" opacity="0.55"/>
    <circle cx="0" cy="52" r="2.2" fill="#C4A35A" opacity="0.55"/>
  </g>
  <!-- corner ornaments -->
  <g stroke="#C4A35A" stroke-width="1.2" fill="none" opacity="0.65">
    <path d="M90 90 L90 118 M90 90 L118 90"/>
    <path d="M710 90 L710 118 M710 90 L682 90"/>
    <path d="M90 1190 L90 1162 M90 1190 L118 1190"/>
    <path d="M710 1190 L710 1162 M710 1190 L682 1190"/>
  </g>
</svg>
