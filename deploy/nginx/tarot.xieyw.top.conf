# HTTP/ACME bootstrap first. After certificates exist, enable the HTTPS server
# and redirect non-ACME HTTP to HTTPS. Replace SERVER_HOST before use.

server {
    listen 80;
    listen [::]:80;
    server_name tarot.xieyw.top;
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }
    location / {
        return 301 https://tarot.xieyw.top$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tarot.xieyw.top;

    ssl_certificate     /etc/letsencrypt/live/tarot.xieyw.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tarot.xieyw.top/privkey.pem;

    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /r/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        access_log /var/log/nginx/tarot.access.log tarot_redacted;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# log_format tarot_redacted '$remote_addr - $host "$request_method /r/[redacted] $server_protocol" $status';
